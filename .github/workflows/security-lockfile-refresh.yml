name: Temporary security lockfile refresh

on:
  push:
    branches:
      - security/fix-dependabot-2026-10
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - name: Regenerate npm lockfile from declared packages
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Clean dependency installation
        run: npm ci --no-fund
      - name: Audit dependencies
        run: npm audit --audit-level=moderate
      - name: Verify production build
        run: npm run build
      - name: Commit validated lockfile
        run: |
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(security): regenerate verified npm lockfile"
            git push origin HEAD:security/fix-dependabot-2026-10
          fi
