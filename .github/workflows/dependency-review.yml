# Dependency Review + npm audit + build
#
# dependency-review: PR'da eklenen/değişen bağımlılıklarda bilinen açık varsa uyarır.
# npm-audit-build: kilit dosyasıyla kurar, açık taraması yapar ve projeyi derler.
# Kaynak: https://github.com/actions/dependency-review-action
name: 'Dependency Review'
on: [pull_request]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v7
      - name: 'Dependency Review'
        uses: actions/dependency-review-action@v5.0.1
        with:
          fail-on-severity: moderate

  npm-audit-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-fund
      - run: npm audit --audit-level=moderate
      - run: npm run build
